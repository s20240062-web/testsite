 const e=M(new THREE.SphereGeometry(.12,6,6),0x000000);e.position.set(-.2,1.5,.45);g.add(e);const e2=e.clone();e2.position.x=.2;g.add(e2);
 const mk=M(new THREE.ConeGeometry(.35,.7,8),0xffffff,{emissive:0xffffff});mk.rotation.x=Math.PI;mk.position.y=3;g.add(mk);g.mk=mk;g.body=b;g.visible=false;scene.add(g);const sw=new THREE.Group(),sec=flat(new THREE.CircleGeometry(1,20,-1.2,2.4),0xffffff,.7),circ=flat(new THREE.CircleGeometry(1,28),0x5aff8a,.5);sw.add(sec,circ);sw.sec=sec;sw.circ=circ;sw.visible=false;scene.add(sw);g.sw=sw;pm.push(g)}
const mkE=[
 ()=>{const m=MB(new THREE.SphereGeometry(.5,10,8),0xff3df0);m.position.y=.9;return m},
 ()=>{const m=MB(new THREE.SphereGeometry(.3,8,6),0xffffff);m.position.y=1;return m},

 ()=>flat(new THREE.RingGeometry(.93,1,64),0xff9a30,.9),

const em=[[],[],[],[],[]];

/* ---------- 入力 ---------- */
const keys={},stk={x:0,y:0},ctl={r:0,atk:0,s:0},cf={x:0,z:-1};let jid=null,jo=null;
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;if(e.code=='ShiftLeft'||e.code=='ShiftRight')ctl.r=1;if(e.code=='KeyE')ctl.s=1;if(e.code=='Space')e.preventDefault()});

const sz=$('stickz'),base=$('base'),knob=$('knob');

sz.onpointerdown=e=>{jid=e.pointerId;sz.setPointerCapture(jid);jo={x:e.clientX,y:e.clientY};base.style.cssText=`display:block;left:${e.clientX-60}px;top:${e.clientY-60}px`;mvS(e)};
sz.onpointermove=mvS;sz.onpointerup=sz.onpointercancel=()=>{jid=null;stk.x=stk.y=0;base.style.display='none';knob.style.transform=''};
$('atk').onpointerdown=e=>{ctl.atk=1;e.target.setPointerCapture(e.pointerId)};$('atk').onpointerup=$('atk').onpointercancel=()=>ctl.atk=0;
$('roll').onpointerdown=()=>ctl.r=1;$('skill').onpointerdown=()=>ctl.s=1;
function getIn(){const k=keys,sx=(k.KeyD||k.ArrowRight?1:0)-(k.KeyA||k.ArrowLeft?1:0)+stk.x,fy=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0)-stk.y;
 return{mx:cf.x*fy-cf.z*sx,mz:cf.z*fy+cf.x*sx,a:(k.Space||ctl.atk)?1:0}}

/* ---------- シミュレーション(ホスト側) ---------- */
const ROLE=[{n:'剣士',s:'大斬り',cd:5},{n:'弓使い',s:'遠矢',cd:4},{n:'僧侶',s:'癒しの陣',cd:9},{n:'槍使い',s:'突き',cd:6}],ACD=.45,RCD=1.1;
function initG(){G={state:'lobby',t:0,ents:[],boss:{x:0,z:0,hp:1,max:1,f:0,ph:0,cd:3,at:null,last:-1,lock:0,stop:0,slow:0},
 pl:[0,1,2,3].map(i=>({slot:i,on:i==0,x:-6+i*4,z:12,hp:100,inv:0,roll:0,rcd:0,acd:0,scd:0,sw:0,swr:0,swk:0,aim:0,fa:-1.57,down:0,rev:0,fx:0,fz:-1,rx:0,rz:-1,in:{mx:0,mz:0,a:0,r:0,s:0}}))}}
function startGame(){const g=G,B=g.boss,n=g.pl.filter(p=>p.on).length;g.ents=[];g.t=0;B.max=B.hp=700*n+300;B.x=B.z=-4;B.cd=3;B.at=null;B.last=-1;B.lock=B.stop=B.slow=0;
 let i=0;for(const p of g.pl)if(p.on){const a=i++/n*6.283+1.2;Object.assign(p,{x:Math.cos(a)*14,z:Math.sin(a)*14,hp:100,inv:1,roll:0,rcd:0,acd:0,scd:0,sw:0,down:0,rev:0})}
 g.state='play'}
function hurt(p,d){if(p.inv>0||p.roll>0||p.down)return 0;p.hp-=d;p.inv=1;if(p.hp<=0){p.hp=0;p.down=1;p.rev=0}return 1}
const alive=()=>G.pl.filter(p=>p.on&&!p.down),push=e=>G.ents.push(e);
const ATK=[
 ()=>{const B=G.boss,n=B.ph?2:1;let t=0,k=0,w=0;B.stop=1;return dt=>{t+=dt;
  if(w<n&&t>=w*1.5){w++;push({k:2,x:B.x,z:B.z,r:7,t:0,d:.9,nd:1})}
  if(k<n&&t>=k*1.5+.9){k++;push({k:3,x:B.x,z:B.z,r:2,v:9+B.ph*2.5,hit:{}})}
  return t>n*1.5+.3}},
 ()=>{const B=G.boss,W=1+B.ph,d=Math.max(.7,1.3-B.ph*.2);let t=0,w=0;const sp=()=>{w++;for(const p of alive())push({k:2,x:p.x,z:p.z,r:4.2,t:0,d});for(let i=0;i<B.ph*2;i++){const a=Math.random()*6.283,r=Math.random()*(R-4);push({k:2,x:Math.cos(a)*r,z:Math.sin(a)*r,r:4.2,t:0,d})}};
  return dt=>{t+=dt;if(w<W&&t>=w*(d+.3))sp();return t>=W*(d+.3)+.2}},
 ()=>{const B=G.boss,A=alive(),tg=A[(Math.random()*A.length)|0]||{x:5,z:5},a=Math.atan2(tg.z-B.z,tg.x-B.x),d=Math.max(.6,1.1-B.ph*.15),e={k:4,x:B.x,z:B.z,a,t:0};push(e);let t=0,s=0;B.lock=1;B.f=a;
  return dt=>{t+=dt;if(s==0){e.t=Math.min(1,t/d);if(t>=d){s=1;e.dead=1}}
   else if(s==1){B.x+=Math.cos(a)*38*dt;B.z+=Math.sin(a)*38*dt;for(const p of alive())if(Math.hypot(p.x-B.x,p.z-B.z)<3.4)hurt(p,40);if(Math.hypot(B.x,B.z)>R-3){s=2;t=0}}
   else if(s==2){if(t>.5)s=3}
   else{const q=Math.hypot(B.x,B.z);if(q<R-6)return 1;B.x-=B.x/q*14*dt;B.z-=B.z/q*14*dt}}},
 ()=>{const B=G.boss,arms=2+B.ph,sp=9+B.ph;B.slow=1;let t=0,e=0,a=0;return dt=>{t+=dt;e+=dt;while(e>.09){e-=.09;a+=(t<2.4?.33:-.33);for(let i=0;i<arms;i++){const q=a+i*6.283/arms;push({k:0,x:B.x,z:B.z,vx:Math.cos(q)*sp,vz:Math.sin(q)*sp,dm:9})}}return t>4.8}},
 // 強攻撃: 跳びかかり叩きつけ(予兆が長く、大ダメージ)
 ()=>{const B=G.boss,A=alive(),tg=A[(Math.random()*A.length)|0]||{x:0,z:0},d=Math.max(.9,1.7-B.ph*.25),tx=tg.x,tz=tg.z;push({k:2,x:tx,z:tz,r:9,t:0,d,dm:55});B.lock=1;let t=0,f=0;
  return dt=>{t+=dt;B.f=Math.atan2(tz-B.z,tx-B.x);if(t<d){const q=Math.min(1,dt*3.5);B.x+=(tx-B.x)*q;B.z+=(tz-B.z)*q}
   else if(!f){f=1;B.x=tx;B.z=tz;if(B.ph)push({k:3,x:tx,z:tz,r:2,v:12,hit:{}})}return t>d+.7}},
 // 遠距離攻撃: 各プレイヤーへの扇状弾
 ()=>{const B=G.boss;B.stop=1;let t=0,k=0;return dt=>{t+=dt;if(k<3&&t>=.7+k*.6){k++;for(const p of alive()){const a=Math.atan2(p.z-B.z,p.x-B.x),m=2+B.ph*2;for(let i=-m;i<=m;i++){const q=a+i*.2;push({k:0,x:B.x,z:B.z,vx:Math.cos(q)*15,vz:Math.sin(q)*15,dm:14})}}}return t>3}}];
function step(dt){const g=G;if(g.state!=='play')return;const B=g.boss,P=g.pl.filter(p=>p.on),A=P.filter(p=>!p.down);
 B.ph=B.hp/B.max>.66?0:B.hp/B.max>.33?1:2;
 for(const p of P){p.inv=Math.max(0,p.inv-dt);p.rcd-=dt;p.acd-=dt;p.scd-=dt;p.sw=Math.max(0,p.sw-dt*4);
  if(p.down){const n=A.filter(q=>Math.hypot(q.x-p.x,q.z-p.z)<3).length;p.rev=Math.max(0,p.rev+(n?dt:-dt*.5));if(p.rev>=2){p.down=0;p.hp=40;p.inv=2;p.rev=0}p.in.s=0;continue}

  if(p.in.a&&p.acd<=0&&p.roll<=0){p.acd=ACD;p.sw=1;p.swr=3.4;p.swk=0;p.aim=aim;p.fa=aim;if(bd<5.8)B.hp-=6}
  if(p.in.s&&p.scd<=0&&p.roll<=0){p.scd=ROLE[p.slot].cd;p.aim=aim;p.fa=aim;p.sw=1;
   if(p.slot==0){p.swr=7;p.swk=1;if(bd<9)B.hp-=38}
   else if(p.slot==1){p.sw=0;push({k:1,x:p.x,z:p.z,vx:ax*32,vz:az*32,s:1,life:1.2,dm:32})}
   else if(p.slot==2){p.swr=8;p.swk=3;if(bd<10)B.hp-=10;for(const q of P)if(Math.hypot(q.x-p.x,q.z-p.z)<8){if(q.down){q.down=0;q.hp=30;q.inv=2;q.rev=0}else q.hp=Math.min(100,q.hp+40)}}
   else{p.swr=10;p.swk=2;if(bd<12)B.hp-=42}}
  p.in.s=0}
 if(A.length){let n=A[0],bd=1e9;for(const p of A){const d=Math.hypot(p.x-B.x,p.z-B.z);if(d<bd){bd=d;n=p}}
  if(!B.lock)B.f=Math.atan2(n.z-B.z,n.x-B.x);
  if(!B.lock&&!B.stop&&bd>5.5){const sp=(3.2+B.ph*1.4)*(B.slow?.55:1);B.x+=(n.x-B.x)/bd*sp*dt;B.z+=(n.z-B.z)/bd*sp*dt;const q=Math.hypot(B.x,B.z);if(q>R-4){B.x*=(R-4)/q;B.z*=(R-4)/q}}}
 if(B.at){if(B.at(dt)){B.at=null;B.lock=B.stop=B.slow=0;B.cd=Math.max(.6,(B.last>=4?3.2:2.2)-B.ph*.65)}}
 else{B.cd-=dt;if(B.cd<=0){const pool=B.ph?[0,1,2,3,4,5]:[0,1,2,5];let i;do{i=pool[(Math.random()*pool.length)|0]}while(i==B.last);B.last=i;B.at=ATK[i]()}}
 for(const e of g.ents){
  if(e.k<2){e.x+=e.vx*dt;e.z+=e.vz*dt;
   if(e.k==1){e.life-=dt;if(e.life<=0)e.dead=1;if(Math.hypot(e.x-B.x,e.z-B.z)<3.3){e.dead=1;B.hp-=e.dm}}
   else{if(Math.hypot(e.x,e.z)>R+10)e.dead=1;for(const p of A)if(Math.hypot(p.x-e.x,p.z-e.z)<1&&hurt(p,e.dm))e.dead=1}}
  else if(e.k==3){e.r+=e.v*dt;if(e.r>46)e.dead=1;for(const p of A)if(!e.hit[p.slot]&&Math.abs(Math.hypot(p.x-e.x,p.z-e.z)-e.r)<.07*e.r+.6&&hurt(p,22))e.hit[p.slot]=1}
  else if(e.k==2){e.t+=dt;if(e.t>=e.d){e.dead=1;if(!e.nd)for(const p of A)if(Math.hypot(p.x-e.x,p.z-e.z)<e.r)hurt(p,e.dm||28)}}}
 g.ents=g.ents.filter(e=>!e.dead);
 if(B.hp<=0){B.hp=0;g.state='win';g.ents=[]}else if(P.length&&!P.some(p=>!p.down)){g.state='lose';g.ents=[]}}
function snapshot(){const g=G,B=g.boss;return{t:'s',s:g.state,
 p:g.pl.map(p=>p.on?[f2(p.x),f2(p.z),Math.round(p.hp),p.down?2:p.roll>0?1:0,p.inv>0?1:0,f2(p.rev),f2(p.fa),f2(p.sw),f2(p.aim),p.swr,p.swk,f2(Math.max(0,p.rcd)/RCD),f2(Math.max(0,p.acd)/ACD),f2(Math.max(0,p.scd)/ROLE[p.slot].cd)]:0),
 b:[f2(B.x),f2(B.z),B.hp,B.max,f2(B.f),B.ph],
 e:g.ents.map(e=>e.k==0?[0,f2(e.x),f2(e.z),0,0,e.vx,e.vz]:e.k==1?[1,f2(e.x),f2(e.z),e.s,0,e.vx,e.vz]:e.k==2?[2,e.x,e.z,e.r,f2(e.t/e.d),0,0]:e.k==3?[3,e.x,e.z,f2(e.r),0,0,0]:[4,e.x,e.z,f2(e.a),f2(e.t),0,0])}}

/* ---------- 通信 ---------- */
const st=m=>$('st').textContent=m,isHost=()=>mode==='host'||mode==='solo';
function enter(){$('menu').style.display='none'}
$('solo').onclick=()=>{mode='solo';initG();startGame();enter()};
$('host').onclick=()=>{st('部屋を作っています…');tryHost()};
function tryHost(){const code=String(1000+(Math.random()*9000|0));peer=new Peer('oniou-'+code);
 peer.on('error',e=>{if(e.type=='unavailable-id')tryHost();else st('接続エラー: '+e.type)});
 peer.on('open',()=>{mode='host';initG();$('room').innerHTML='部屋コード <b style="font-size:22px">'+code+'</b>';enter()});
 peer.on('connection',c=>{c.on('open',()=>{const p=G.pl.find(p=>!p.on);
  if(G.state=='play'||!p){c.send({t:'x',m:G.state=='play'?'戦闘中です。次の回からどうぞ':'満員です'});setTimeout(()=>c.close(),300);return}
  p.on=true;c.slot=p.slot;conns.push(c);c.send({t:'w',slot:p.slot})});
  c.on('data',d=>{if(d.t=='i'&&c.slot!=null){const p=G.pl[c.slot];p.in.mx=d.mx;p.in.mz=d.mz;p.in.a=d.a;if(d.r)p.in.r=1;if(d.s)p.in.s=1}});
  c.on('close',()=>{if(c.slot!=null)G.pl[c.slot].on=false;conns=conns.filter(x=>x!==c)})})}
$('join').onclick=()=>{const code=$('code').value.trim();if(code.length!=4)return st('4桁のコードを入力してください');st('接続中…');
 peer=new Peer();peer.on('error',e=>st(e.type=='peer-unavailable'?'部屋が見つかりません':'接続エラー: '+e.type));
 peer.on('open',()=>{hconn=peer.connect('oniou-'+code,{reliable:false});
  hconn.on('data',d=>{if(d.t=='w'){myslot=d.slot;mode='client';enter();$('room').textContent='参加中'}else if(d.t=='s'){snap=d;snapT=performance.now()}else if(d.t=='x'){st(d.m);hconn.close()}});
  hconn.on('close',()=>{if(mode=='client'){mode='menu';$('menu').style.display='flex';st('切断されました')}})})};
$('go').onclick=()=>{if(isHost())startGame()};

/* ---------- 描画・HUD ---------- */
function render(dt,now){const s=snap;if(!s)return;const cl=mode==='client',k=cl?1-Math.exp(-dt*22):1,age=cl?Math.min(.1,(now-snapT)/1000):0;
 s.p.forEach((d,i)=>{const m=pm[i];if(!d){m.visible=false;m.sw.visible=false;return}
  if(!m.init){m.position.set(d[0],0,d[1]);m.init=1}
  m.position.x+=(d[0]-m.position.x)*k;m.position.z+=(d[1]-m.position.z)*k;
  m.visible=!d[4]||(now/60|0)%2==0;m.rotation.y=Math.PI/2-d[6];m.rotation.z=d[3]==2?Math.PI/2:0;m.position.y=d[3]==2?.6:0;m.scale.y=d[3]==1?.6:1;m.mk.visible=i==myslot&&d[3]!=2;
  const w=m.sw,K=d[10];w.visible=d[7]>0;if(w.visible){w.position.set(m.position.x,.1,m.position.z);w.rotation.y=-d[8];w.sec.visible=K<3;w.circ.visible=K==3;
   w.sec.scale.set(d[9],d[9]*(K==2?.25:1),1);w.circ.scale.set(d[9],d[9],1);const c=[0xffffff,0xffd84a,0x6ae0ff,0x5aff8a][K];
   for(const o of[w.sec,w.circ]){o.material.color.setHex(c);o.material.opacity=d[7]*.75}}});
 const b=s.b;bossG.position.x+=(b[0]-bossG.position.x)*k;bossG.position.z+=(b[1]-bossG.position.z)*k;bossG.rotation.y=Math.PI/2-b[4];
 bossG.position.y=Math.sin(now/300)*.15;bodyM.material.emissive.setHex(b[5]==2?0x660010:b[5]==1?0x2a0008:0);
 // TPS: 自分の背後からボスを見るロックオンカメラ
 const me=pm[myslot],bp=bossG.position;let fx=bp.x-me.position.x,fz=bp.z-me.position.z,l=Math.hypot(fx,fz);
 if(l>1){fx/=l;fz/=l;const q=Math.min(1,dt*5);cf.x+=(fx-cf.x)*q;cf.z+=(fz-cf.z)*q;const n=Math.hypot(cf.x,cf.z);if(n>.01){cf.x/=n;cf.z/=n}else{cf.x=fx;cf.z=fz}}
 cam.position.set(me.position.x-cf.x*12,8,me.position.z-cf.z*12);cam.lookAt(me.position.x+cf.x*8,1.5,me.position.z+cf.z*8);
 const c=[0,0,0,0,0];for(const e of s.e){const t=e[0],i=c[t]++;let m=em[t][i];if(!m){m=mkE[t]();em[t][i]=m;scene.add(m)}m.visible=true;
  m.position.x=e[1]+e[5]*age;m.position.z=e[2]+e[6]*age;
  if(t==1)m.material.color.setHex(COL[e[3]]);
  else if(t==2){m.scale.set(e[3],1,e[3]);m.inner.scale.set(Math.max(.01,e[4]),Math.max(.01,e[4]),1)}
  else if(t==3)m.scale.set(e[3],e[3],1);
  else if(t==4){m.rotation.y=-e[3];m.fill.scale.y=5*Math.max(.01,e[4])}}
 for(let t=0;t<5;t++)for(let i=c[t];i<em[t].length;i++)em[t][i].visible=false;
 ren.render(scene,cam)}
let lastH='';
function hud(){const s=snap;if(!s)return;const b=s.b;$('bossf').style.width=(b[3]?b[2]/b[3]*100:100)+'%';$('bossn').textContent=b[5]==2?'鬼王 ─ 猛攻!':'鬼王';
 const n=s.p.filter(Boolean).length;
 const h=s.p.map((d,i)=>d?`<div style="color:${CSS[i]};margin-bottom:6px">P${i+1} ${ROLE[i].n}${i==myslot?' ◀':''}<div class="hp"><i style="width:${d[2]}%;background:${d[2]<30?'#ff3a3a':CSS[i]}"></i></div>${d[3]==2?'<small>倒れた! 近づいて救助 '+Math.round(d[5]/2*100)+'%</small>':''}</div>`:'').join('');
 if(h!==lastH){$('pl').innerHTML=h;lastH=h}
 const me=s.p[myslot];if(me){$('c-roll').style.height=me[11]*100+'%';$('c-atk').style.height=me[12]*100+'%';$('c-skill').style.height=me[13]*100+'%'}
 $('sn').textContent=ROLE[myslot].s;
 const ms={lobby:`待機中 ${n}/4人`,win:'撃破!!',lose:'全滅…',play:''}[s.s];$('msg').textContent=ms;
 const g=$('go');g.style.display=isHost()&&s.s!=='play'?'block':'none';g.textContent=s.s=='lobby'?'開始':'もう一度'}
let last=performance.now(),acc=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(mode==='menu')return;
 const c=getIn();acc+=dt;
 if(isHost()){const p=G.pl[0];p.in.mx=c.mx;p.in.mz=c.mz;p.in.a=c.a;if(ctl.r)p.in.r=1;if(ctl.s)p.in.s=1;ctl.r=ctl.s=0;step(dt);snap=snapshot();snapT=now;
  if(acc>.033){acc=0;const d=snap;for(const q of conns)if(q.open)q.send(d)}}
 else if(hconn&&hconn.open&&acc>.033){acc=0;hconn.send({t:'i',mx:f2(c.mx),mz:f2(c.mz),a:c.a,r:ctl.r,s:ctl.s});ctl.r=ctl.s=0}
 render(dt,now);hud()}
requestAnimationFrame(loop);
</script></body></html>
